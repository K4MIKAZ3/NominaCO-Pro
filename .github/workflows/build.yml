name: Build NominaCO-Pro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta el secret RELEASE_KEYSTORE_BASE64."
            echo "Ejecuta el workflow 'Setup release signing (once)' y luego scripts/setup-github-secrets.ps1"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Configure signing
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Configure Supabase (optional)
        run: |
          touch local.properties
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found at $APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          cp "$APK" "NominaCO-Pro-v${VERSION}-signed.apk"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NominaCO-Pro-installable
          path: NominaCO-Pro-v${{ env.APK_VERSION }}-signed.apk
