name: Build NominaCO-Pro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create release keystore
        env:
          STORE_PASS: NominaCOPro2026
          KEY_PASS: NominaCOPro2026
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias nominacopro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NominaCO Pro, OU=Mobile, O=Berrocal, L=Bogota, ST=Cundinamarca, C=CO"

      - name: Configure signing
        env:
          STORE_PASS: NominaCOPro2026
          KEY_PASS: NominaCOPro2026
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=nominacopro
          keyPassword=$KEY_PASS
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found at $APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          cp "$APK" "NominaCO-Pro-v1.1.0-signed.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NominaCO-Pro-installable
          path: NominaCO-Pro-v1.1.0-signed.apk
