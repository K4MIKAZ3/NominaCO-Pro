name: Build Play Store AAB

on:
  push:
    branches: [play-store]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta el secret RELEASE_KEYSTORE_BASE64."
            echo "Ejecuta el workflow 'Setup release signing (once)' y luego scripts/setup-github-secrets.ps1"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Configure signing
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Configure Supabase (optional)
        run: |
          touch local.properties
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Prepare AAB artifact
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ ! -f "$AAB" ]; then
            echo "Signed AAB not found at $AAB"
            ls -la app/build/outputs/bundle/release/ || true
            exit 1
          fi
          cp "$AAB" "NominaCO-Pro-v${VERSION}-play.aab"
          echo "AAB_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: NominaCO-Pro-play-aab
          path: NominaCO-Pro-v${{ env.AAB_VERSION }}-play.aab
