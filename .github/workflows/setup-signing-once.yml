# Ejecutar UNA sola vez desde GitHub → Actions → "Setup release signing (once)" → Run workflow
# Descarga el artefacto release-keystore-setup y ejecuta scripts/setup-github-secrets.ps1

name: Setup release signing (once)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Generate release keystore
        run: |
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          KEY_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias nominacopro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NominaCO Pro, OU=Mobile, O=Berrocal, L=Bogota, ST=Cundinamarca, C=CO"
          base64 -w 0 release.keystore > release.keystore.b64
          cat > INSTRUCCIONES.txt <<EOF
          Keystore de firma permanente para NominaCO Pro
          ==============================================

          1. Descarga release.keystore de este artefacto.
          2. En PowerShell, desde la carpeta del proyecto:
               .\scripts\setup-github-secrets.ps1 `
                 -KeystorePath ".\release.keystore" `
                 -StorePassword "<STORE_PASS abajo>" `
                 -KeyPassword "<KEY_PASS abajo>"

          Contraseñas generadas para ESTE keystore (guárdalas en un gestor; no se repiten):
            STORE_PASSWORD = ${STORE_PASS}
            KEY_PASSWORD   = ${KEY_PASS}
            KEY_ALIAS      = nominacopro

          IMPORTANTE:
          - Guarda release.keystore y las contraseñas en un lugar seguro.
          - Todas las APK futuras usarán esta misma firma → se instalan encima sin desinstalar.
          - Si ya tenías una APK de CI antigua instalada, desinstálala UNA vez antes de instalar
            la primera APK firmada con este keystore permanente.
          EOF

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-setup
          path: |
            release.keystore
            release.keystore.b64
            INSTRUCCIONES.txt
