# Ejecutar manualmente cuando haya un PAT con write en NominappEmpresas.
name: Transfer foundation → NominappEmpresas
on:
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force-push this commit to NominappEmpresas main
        env:
          EMPRESAS_TOKEN: ${{ secrets.EMPRESAS_PUSH_TOKEN }}
        run: |
          if [ -z "$EMPRESAS_TOKEN" ]; then
            echo "Falta secret EMPRESAS_PUSH_TOKEN (PAT con repo write en NominappEmpresas)"
            exit 1
          fi
          git remote add empresas "https://x-access-token:${EMPRESAS_TOKEN}@github.com/K4MIKAZ3/NominappEmpresas.git"
          git push --force empresas HEAD:main
