<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Lunes festivo y jornada de 42 horas en Colombia</title>
  <desc id="desc">Ilustracion editorial de un calendario con lunes festivo remunerado y una semana laboral de 42 horas.</desc>
  <defs>
